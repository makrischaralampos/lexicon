spring:
  application:
    name: lexicon
  http:
    client:
      connect-timeout: 5s
      read-timeout: 120s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/lexicon}
    username: ${DB_USER:lexicon}
    password: ${DB_PASSWORD:lexicon}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${LEXICON_CHAT_MODEL:llama3.2:3b}
          temperature: 0.1
      embedding:
        options:
          model: ${LEXICON_EMBEDDING_MODEL:nomic-embed-text}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

server:
  shutdown: graceful

lexicon:
  ingestion:
    chunk-size: 400
    chunk-overlap: 80
    embedding-batch-size: 32
    embedding-dimensions: 768
  retrieval:
    default-top-k: 5
    max-top-k: 20
    candidate-pool: 30
    rrf-k: 60
  answer:
    min-similarity: 0.40
    max-context-chars: 8000
    min-support: 0.50
  embedding:
    query-prefix: "search_query: "
    document-prefix: "search_document: "
  rate-limit:
    enabled: true
    default-per-minute: 120
    answers-per-minute: 10

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
