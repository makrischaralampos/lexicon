name: Evaluation

# The full benchmark needs a real local LLM, so it runs on demand and weekly instead of on every push.
# It fails when quality drops below the thresholds in application-eval.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: lexicon_eval
          POSTGRES_USER: lexicon
          POSTGRES_PASSWORD: lexicon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexicon -d lexicon_eval"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      EVAL_DB_URL: jdbc:postgresql://localhost:5432/lexicon_eval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Ollama and pull models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 2; done
          ollama pull nomic-embed-text
          ollama pull llama3.2:3b

      # The judge is skipped in CI: a 3B model grading itself is too noisy to be worth the extra minutes.
      - name: Run evaluation
        run: >-
          ./mvnw -B -ntp spring-boot:run
          -Dspring-boot.run.profiles=eval
          -Dspring-boot.run.arguments="--lexicon.eval.report-name=ci --lexicon.eval.judge=false"

      - name: Publish report
        if: always()
        run: |
          if [ -f eval/reports/ci.md ]; then cat eval/reports/ci.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/ci.md
