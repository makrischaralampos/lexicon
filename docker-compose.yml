services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: lexicon-postgres
    environment:
      POSTGRES_DB: lexicon
      POSTGRES_USER: lexicon
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lexicon}
    ports:
      - "5433:5432"
    volumes:
      - lexicon-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexicon -d lexicon"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lexicon-pgdata:
